name: Option 3 release checks
on:
  pull_request:
  push:
    branches: [release/option-3-pilot]
permissions:
  contents: read
jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm run lint:release
      - run: npm run test:release
      - run: npm run build
        env:
          VITE_APP_ENV: preview
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_PUBLIC_KEY: sb_publishable_fixture
          VITE_MOBILE_BORROWER: 'true'
          VITE_HOSTED_SERVICES_ENABLED: 'true'
          VITE_RELEASE_ACCESS_ENABLED: 'true'
          VITE_ALLOW_DEMO: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-build-${{ github.sha }}
          path: dist
          retention-days: 7
  database-migration-and-accounting:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Official Docker Hub copy; identical verified digest avoids anonymous ECR limits.
        image: docker.io/supabase/postgres:17.11.0.002@sha256:0450166354dc9c1d25f0322ac8b580774d4fb0184d2b087f6e4fe9499c66cf53
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: node release/option3/generate-forward.cjs
      - run: git diff --exit-code -- release/option3/forward-candidate.sql release/option3/manifest.json
      - run: node --test --test-concurrency=1 tests/integration/migration-rollback.test.cjs tests/integration/payment-posting.test.cjs tests/integration/support-tracking.test.cjs tests/integration/combinedFeeMigration.test.cjs tests/integration/transactionGroupMigration.test.cjs tests/integration/retailBrands.test.cjs tests/integration/groupLogos.test.cjs tests/integration/retailLogoUploads.test.cjs tests/integration/request-security.test.cjs
        env:
          PAYMENT_TEST_PORT: '25432'
          RUN_FEE_SQL_TESTS: '1'
          FEE_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:25432/postgres
# No production deploy job. Hosted acceptance and a reviewed migration are gates.

  borrower-activity-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify borrower activity links and mobile branding using isolated fixtures
        run: |
          python3 -m http.server 5182 --bind 127.0.0.1 --directory public &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5182/borrower-v4.12.24.html >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/borrower-activity-links.spec.js --project=Chromium
        env:
          APP_TEST_URL: http://127.0.0.1:5182
