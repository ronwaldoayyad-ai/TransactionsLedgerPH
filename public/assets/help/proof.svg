<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">From selected dues to proof review</title><desc id="desc">Four stages of selecting dues, confirming allocation, uploading a supported proof and reviewing details.</desc><rect width="640" height="360" rx="22" fill="#f3f7fd"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="21" fill="#142a48" font-weight="750">From selected dues to proof review</text><text x="24" y="57" font-size="13" fill="#657e9e" font-weight="500">LoanLedger PH · Illustrated guide</text><rect x="24" y="91" width="140" height="178" rx="18" fill="#fff" stroke="#dce7f5"/><circle cx="94" cy="127" r="21" fill="#1769f5"/><text x="88" y="134" font-size="20" fill="#fff" font-weight="700">1</text><text x="39" y="180" font-size="18" fill="#173252" font-weight="700">Select dues</text><text x="34" y="210" font-size="12" fill="#657e9e" font-weight="500">Choose dates/items</text><rect x="177" y="91" width="140" height="178" rx="18" fill="#fff" stroke="#dce7f5"/><circle cx="247" cy="127" r="21" fill="#1769f5"/><text x="241" y="134" font-size="20" fill="#fff" font-weight="700">2</text><text x="192" y="180" font-size="18" fill="#173252" font-weight="700">Confirm</text><text x="187" y="210" font-size="12" fill="#657e9e" font-weight="500">Review allocation</text><rect x="330" y="91" width="140" height="178" rx="18" fill="#fff" stroke="#dce7f5"/><circle cx="400" cy="127" r="21" fill="#1769f5"/><text x="394" y="134" font-size="20" fill="#fff" font-weight="700">3</text><text x="345" y="180" font-size="18" fill="#173252" font-weight="700">Upload</text><text x="340" y="210" font-size="12" fill="#657e9e" font-weight="500">File up to 5 MB</text><rect x="483" y="91" width="140" height="178" rx="18" fill="#fff" stroke="#dce7f5"/><circle cx="553" cy="127" r="21" fill="#1769f5"/><text x="547" y="134" font-size="20" fill="#fff" font-weight="700">4</text><text x="498" y="180" font-size="18" fill="#173252" font-weight="700">Review</text><text x="493" y="210" font-size="12" fill="#657e9e" font-weight="500">Check bank details</text><rect x="24" y="282" width="592" height="35" rx="18" fill="#eaf8f0" stroke="#eaf8f0"/><text x="43" y="305" font-size="16" fill="#007e5d" font-weight="650">Submit once → Pending review → Lender verifies and posts</text><text x="24" y="342" font-size="13" fill="#657e9e" font-weight="500">Example only · Your records and layout may differ.</text></g></svg>
