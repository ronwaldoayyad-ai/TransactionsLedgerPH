<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">A loan request is a reviewed process</title><desc id="desc">The lender enables access, the borrower reviews and submits, and the lender evaluates; submission is not guaranteed approval.</desc><rect width="640" height="360" rx="22" fill="#f3f7fd"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="21" fill="#142a48" font-weight="750">A loan request is a reviewed process</text><text x="24" y="57" font-size="13" fill="#657e9e" font-weight="500">LoanLedger PH · Illustrated guide</text><rect x="24" y="87" width="185" height="184" rx="18" fill="#fff" stroke="#dce7f5"/><text x="42" y="120" font-size="19" fill="#173252" font-weight="700">1  Access</text><text x="42" y="158" font-size="16" fill="#173252" font-weight="500">Lender enables</text><text x="42" y="182" font-size="16" fill="#173252" font-weight="500">Request a Loan</text><rect x="42" y="211" width="128" height="34" rx="17" fill="#eaf8f0" stroke="#eaf8f0"/><text x="55" y="234" font-size="14" fill="#007e5d" font-weight="650">Visible</text><rect x="227" y="87" width="185" height="184" rx="18" fill="#fff" stroke="#dce7f5"/><text x="245" y="120" font-size="19" fill="#173252" font-weight="700">2  Request</text><text x="245" y="158" font-size="16" fill="#173252" font-weight="500">Review amount,</text><text x="245" y="182" font-size="16" fill="#173252" font-weight="500">term and fees</text><text x="245" y="224" font-size="16" fill="#1769f5" font-weight="650">Confirm details</text><rect x="430" y="87" width="185" height="184" rx="18" fill="#fff" stroke="#dce7f5"/><text x="448" y="120" font-size="19" fill="#173252" font-weight="700">3  Review</text><text x="448" y="158" font-size="16" fill="#173252" font-weight="500">Lender checks</text><text x="448" y="182" font-size="16" fill="#173252" font-weight="500">the application</text><rect x="448" y="211" width="141" height="34" rx="17" fill="#edf4ff" stroke="#edf4ff"/><text x="461" y="234" font-size="14" fill="#1769f5" font-weight="650">Under review</text><text x="24" y="304" font-size="17" fill="#657e9e" font-weight="500">Submission does not guarantee approval or a bank transfer.</text><text x="24" y="342" font-size="13" fill="#657e9e" font-weight="500">Example only · Your records and layout may differ.</text></g></svg>
