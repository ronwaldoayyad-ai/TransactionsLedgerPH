ght="34" rx="17" fill="#fff1f1" stroke="#fff1f1"/><text x="220" y="313" font-size="14" fill="#bd3c54" font-weight="650">Fees</text><rect x="327" y="290" width="170" height="34" rx="17" fill="#eaf8f0" stroke="#eaf8f0"/><text x="340" y="313" font-size="14" fill="#007e5d" font-weight="650">Adjustments</text><text x="24" y="342" font-size="13" fill="#657e9e" font-weight="500">Example only · Your records and layout may differ.</text></g></svg>
