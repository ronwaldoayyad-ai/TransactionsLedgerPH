<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Three records, three download buttons</title><desc id="desc">Proof is the uploaded evidence, Receipt is the acknowledgement, and Confirmation shows submission or approval.</desc><rect width="640" height="360" rx="22" fill="#f3f7fd"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="21" fill="#142a48" font-weight="750">Three records, three download buttons</text><text x="24" y="57" font-size="13" fill="#657e9e" font-weight="500">LoanLedger PH · Illustrated guide</text><rect x="24" y="82" width="592" height="226" rx="18" fill="#fff" stroke="#dce7f5"/><text x="44" y="115" font-size="19" fill="#173252" font-weight="750">Recent Payments</text><rect x="462" y="94" width="128" height="34" rx="17" fill="#eaf8f0" stroke="#eaf8f0"/><text x="475" y="117" font-size="14" fill="#007e5d" font-weight="650">Approved</text><text x="44" y="146" font-size="15" fill="#657e9e" font-weight="500">Example payment · Reference EXAMPLE</text><rect x="44" y="165" width="166" height="57" rx="18" fill="#f5f9ff" stroke="#dce7f5"/><rect x="237" y="165" width="166" height="57" rx="18" fill="#f5f9ff" stroke="#dce7f5"/><rect x="430" y="165" width="166" height="57" rx="18" fill="#f5f9ff" stroke="#dce7f5"/><text x="94" y="201" font-size="20" fill="#1769f5" font-weight="700">Proof</text><text x="282" y="201" font-size="20" fill="#1769f5" font-weight="700">Receipt</text><text x="448" y="201" font-size="18" fill="#1769f5" font-weight="700">Confirmation</text><text x="60" y="252" font-size="16" fill="#173252" font-weight="500">Original upload</text><text x="247" y="252" font-size="16" fill="#173252" font-weight="500">Acknowledgement</text><text x="444" y="252" font-size="15" fill="#173252" font-weight="500">Status + timestamps</text><text x="44" y="282" font-size="15" fill="#657e9e" font-weight="500">Use the row belonging to the correct payment.</text><text x="24" y="342" font-size="13" fill="#657e9e" font-weight="500">Example only · Your records and layout may differ.</text></g></svg>
